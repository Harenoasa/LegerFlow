spring:
  application:
    name: ledgerflow-common
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ledgerflow?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

ledgerflow:
  snowflake:
    # 多实例部署时每个实例必须配置不同的 worker-id / datacenter-id
    worker-id: ${SNOWFLAKE_WORKER_ID:0}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:0}
  timeout:
    payment: ${PAY_TIMEOUT_MINUTES:10}

